name: Build Ubuntu GSI

on:
  push:
    branches:
      - android-12.0
      - android-13.0
      - android-14.0
      - android-15.0
      - android-16.0
    tags: ['v*']
  pull_request:
    branches:
      - android-12.0
      - android-13.0
      - android-14.0
      - android-15.0
      - android-16.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — leave empty to skip release creation'
        required: false
        default: ''

jobs:
  lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . -name '*.sh' \
            -not -path './third_party/*' \
            -not -path './builder/out/*' \
            -not -path './builder/cache/*' \
            -not -path './deprecated/*' \
            -print0 | xargs -0 shellcheck --severity=warning

  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.set.outputs.mode }}
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Resolve build mode and version matrix
        id: set
        run: |
          ref="${GITHUB_REF_NAME}"
          event="${{ github.event_name }}"
          all='["android-12.0","android-13.0","android-14.0","android-15.0","android-16.0"]'

          if [ "$event" = "pull_request" ]; then
            ref="${{ github.base_ref }}"
          fi

          mode="single"
          matrix=""

          case "$ref" in
            main)
              mode="multi"
              matrix="$all"
              ;;
            v*)
              # Tag builds publish all vendor system images + shared userdata/vbmeta.
              mode="multi"
              matrix="$all"
              ;;
            android-12.0|android-13.0|android-14.0|android-15.0|android-16.0)
              mode="single"
              matrix="[\"$ref\"]"
              ;;
            *)
              echo "Unsupported ref for build: $ref (event=$event)"
              exit 1
              ;;
          esac

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$mode matrix=$matrix"

  build-shared:
    name: Shared userdata + vbmeta
    runs-on: ubuntu-latest
    needs: [lint, prepare]
    if: needs.prepare.outputs.mode == 'multi'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: "true"
      GSI_CI_MINIMAL_PACKAGES: "1"
      GSI_ROOTFS_PROFILE: minimal
      # Vendor env is required by config.env; rootfs/userdata/vbmeta do not vary by PHH version.
      VENDOR_ANDROID_VERSION: android-16.0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            e2fsprogs \
            erofs-utils \
            f2fs-tools \
            jq \
            debootstrap \
            qemu-user-static \
            wget \
            unzip \
            xz-utils \
            android-sdk-libsparse-utils

      - name: Build shared rootfs seed + vbmeta
        run: |
          chmod +x build.sh scripts/*.sh
          sudo -E bash scripts/sync_device_phh.sh
          sudo -E bash scripts/build_rootfs.sh
          sudo -E bash scripts/build_rootfs_erofs.sh
          sudo -E bash scripts/build_vbmeta_disabled.sh
          sudo -E bash scripts/build_userdata_img.sh
          ls -lh builder/out/linux_rootfs.erofs builder/out/userdata.img builder/out/vbmeta-disabled.img

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-gsi-shared-${{ github.run_number }}
          path: |
            builder/out/linux_rootfs.erofs
            builder/out/userdata.img
            builder/out/vbmeta-disabled.img
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}
          if-no-files-found: error

  build:
    name: Build ${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: [lint, prepare, build-shared]
    if: >
      always() &&
      needs.lint.result == 'success' &&
      needs.prepare.result == 'success' &&
      (
        (needs.prepare.outputs.mode == 'multi' && needs.build-shared.result == 'success') ||
        (needs.prepare.outputs.mode == 'single' && needs.build-shared.result == 'skipped')
      )
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: "true"
      GSI_CI_MINIMAL_PACKAGES: "1"
      VENDOR_ANDROID_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            e2fsprogs \
            erofs-utils \
            f2fs-tools \
            jq \
            debootstrap \
            qemu-user-static \
            wget \
            unzip \
            xz-utils \
            android-sdk-libsparse-utils

      - name: Download shared erofs (multi mode)
        if: needs.prepare.outputs.mode == 'multi'
        uses: actions/download-artifact@v6
        with:
          name: ubuntu-gsi-shared-${{ github.run_number }}
          path: builder/out

      - name: Build full images (single mode)
        if: needs.prepare.outputs.mode == 'single'
        run: |
          chmod +x build.sh scripts/*.sh
          sudo -E bash build.sh

      - name: Build system image only (multi mode)
        if: needs.prepare.outputs.mode == 'multi'
        run: |
          chmod +x build.sh scripts/*.sh
          test -f builder/out/linux_rootfs.erofs
          sudo -E bash scripts/sync_device_phh.sh
          sudo -E bash scripts/fetch_phh_gsi.sh
          sudo -E bash scripts/build_system_img.sh
          sudo -E bash scripts/package_release_artifacts.sh

      - name: Verify artifacts
        run: |
          SYS="${VENDOR_ANDROID_VERSION}_system.img"
          echo "=== Build Artifacts (${VENDOR_ANDROID_VERSION}) mode=${{ needs.prepare.outputs.mode }} ==="
          ls -lh "builder/out/${SYS}"
          if [ "${{ needs.prepare.outputs.mode }}" = "single" ]; then
            ls -lh builder/out/userdata.img
            ls -lh builder/out/vbmeta-disabled.img
            ls -lh builder/out/linux_rootfs.erofs
          fi

      - name: Upload artifacts (single mode)
        if: success() && needs.prepare.outputs.mode == 'single'
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-gsi-${{ matrix.version }}-${{ github.run_number }}
          path: |
            builder/out/${{ matrix.version }}_system.img
            builder/out/userdata.img
            builder/out/vbmeta-disabled.img
            builder/out/linux_rootfs.erofs
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}
          if-no-files-found: error

      - name: Upload system image (multi mode)
        if: success() && needs.prepare.outputs.mode == 'multi'
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-gsi-system-${{ matrix.version }}-${{ github.run_number }}
          path: builder/out/${{ matrix.version }}_system.img
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build, build-shared]
    if: >
      always() &&
      (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) &&
      needs.prepare.result == 'success' &&
      needs.build.result == 'success' &&
      (
        (needs.prepare.outputs.mode == 'multi' && needs.build-shared.result == 'success') ||
        (needs.prepare.outputs.mode == 'single' && needs.build-shared.result == 'skipped')
      )
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets

      - name: Prepare release asset list (xz system images; skip files >= 2GB)
        id: release_assets
        run: |
          max_size=2147483647
          mkdir -p staging
          assets=""
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils

          # Copy shared small artifacts once.
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              userdata.img|vbmeta-disabled.img) ;;
              *) continue ;;
            esac
            dest="staging/$base"
            if [ -e "$dest" ]; then
              continue
            fi
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$max_size" ]; then
              echo "Skipping $base ($size bytes) because GitHub release asset limit is 2GB"
              continue
            fi
            cp -f "$f" "$dest"
            assets="${assets}${dest}\n"
            echo "Include $base ($size bytes)"
          done < <(find release-assets -type f -print0)

          # Compress each system.img so multi-vendor releases fit under 2GB.
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              android-*_system.img) ;;
              *) continue ;;
            esac
            xz_name="${base}.xz"
            dest="staging/$xz_name"
            if [ -e "$dest" ]; then
              continue
            fi
            echo "Compressing $base -> $xz_name ..."
            xz -T0 -6 -c -f "$f" > "$dest"
            size=$(stat -c%s "$dest")
            if [ "$size" -gt "$max_size" ]; then
              echo "Skipping $xz_name ($size bytes) because GitHub release asset limit is 2GB"
              rm -f "$dest"
              continue
            fi
            assets="${assets}${dest}\n"
            echo "Include $xz_name ($size bytes from $(stat -c%s "$f") raw)"
          done < <(find release-assets -type f -name 'android-*_system.img' -print0)

          {
            echo "files<<EOF"
            printf "%b" "$assets"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "=== Staging ==="
          ls -lh staging || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          name: Ubuntu GSI ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          body: |
            ## Ubuntu GSI ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

            ### Artifacts
            | File | Description |
            |------|-------------|
            | `android-XX_system.img.xz` | Per-vendor system image (compressed; decompress before flash) |
            | `userdata.img` | Shared seed for `/data/ubuntu-gsi/rootfs.erofs` (not vendor-specific) |
            | `vbmeta-disabled.img` | Shared disabled vbmeta (`flags=3`; not vendor-specific) |

            Note: Assets larger than 2GB after compression are skipped.
            Uncompressed raw images remain available as workflow artifacts.

            ### Flash instructions
            ```sh
            xz -dk android-16.0_system.img.xz   # pick matching vendor major
            fastboot flash vbmeta_a vbmeta-disabled.img
            fastboot flash vbmeta_system_a vbmeta-disabled.img
            fastboot flash vbmeta_vendor_a vbmeta-disabled.img
            fastboot reboot fastboot
            fastboot flash system_a android-16.0_system.img
            fastboot flash userdata userdata.img
            fastboot reboot
            ```

            Do **not** pass `--disable-verity` / `--disable-verification` when flashing
            standalone `vbmeta*.img` (fastboot 34+). Verity is disabled via baked-in `flags=3`.
          files: ${{ steps.release_assets.outputs.files }}
          draft: false
          prerelease: ${{ contains(startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag, '-') }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
